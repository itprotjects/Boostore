<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="css/Boostore.css">
    </head>
<body>
    

    <main class="login-body">
        <div class="login-side">

            <!-- form to the left -->
            <div class="form-area">
                <form>
                    <h2>Login</h2>
                    <div class="under-h2">
                        <input type="text" placeholder="Email">
                        <input type="password" placeholder="Password" >
    
                        <button type="submit">Login</button>
                    </form>
    
                    <p class="switch-to-signups">
                        Don't have an account? 
                        <a href="signup.html">Sign Up</a>
                    </p>
                    </div>
            </div>

            <!-- image to the right -->
            <img class="image-area" 
                src="images/login.jpeg" 
                alt="">

        </div>
    </main>


</body>
</html>
