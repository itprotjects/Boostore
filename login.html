<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Boostore.css" id="theme-link">
    <link rel="stylesheet" href="css/responsive.css">
    <title>BOOKNEST</title>
</head>
<body>
    <header class="header">
        <h1 class="web-name"><a href="index.html">Booknest</a></h1>
        <button class="theme-change"> change theme</button>
    </header>
    

    
    <!-- body of the from -->
    <main class="login-body">
         <!-- form container -->
        <div class="login-side">
            <!-- form to the left -->
            <div class="form-area">
                <!-- inside the form -->
                <form id="loginForm">
                     <!-- title name (log in) -->
                    <h2>Login</h2>
                    <div class="under-h2">
                         <!-- e mail and password -->
                        <input id="login_email" type="text" placeholder="Email">
                        <input id="login_password" type="password" placeholder="Password" >    
                        <button type="submit">Login</button>
                    </form>
                     <!-- submit without doing anything = error -->
                    <div id="loginError" style="color: red; display: none;"></div>    
                    <p class="switch-to-signups">
                        Don't have an account? 
                        <a href="signup.html">Sign Up</a>
                    </p>
                    </div>
            </div>
            <!-- image to the right -->
            <img class="image-area" 
                src="images/login.jpeg" 
                alt="book shelf">
        </div>
    </main>
    <script src="JS/theme.js"></script>
    <script src="JS/validation.js"></script>
</body>
</html>
