<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Boostore.css" id="theme-link">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Boostore</title>
</head>
<body>
    <body>
    <header class="header">
        <h1 class="web-name"><a href="index.html">Booknest</a></h1>
        <button class="theme-change"> change theme</button>
    </header>


    <main class="login-body">
        <div class="login-side">

            <!-- image to the left -->
            <img class="image-area" 
                src="images/sign-up.jpeg" 
                alt="">

            <!-- form to the right -->
            <div class="form-area">
                <form>
                    <h2>Sign Up</h2>

                    <div class="under-h2">
                        <input type="text" placeholder="Full Name" >
                        <input type="text" placeholder="Email" >
                        <input type="password" placeholder="Password" >
                        <input type="password" placeholder="Confirm Password">

                        <button type="submit">Sign Up</button>
                    </div>
                </form>

                <p class="switch-to-signups">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>

        </div>
    </main>
    <script src="JS/theme.js"></script>

</body>
</html>
