<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/Boostore.css" id="theme-link">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Boostore</title>
</head>
<body>
    <header class="header">
        <h1 class="web-name"><a href="index.html">Booknest</a></h1>
        <button class="theme-change"> change theme</button>
    </header>
    

    <main class="login-body">
        <div class="login-side">

            <!-- form to the left -->
            <div class="form-area">
                <form>
                    <h2>Login</h2>
                    <div class="under-h2">
                        <input type="text" placeholder="Email">
                        <input type="password" placeholder="Password" >
    
                        <button type="submit">Login</button>
                    </form>
    
                    <p class="switch-to-signups">
                        Don't have an account? 
                        <a href="signup.html">Sign Up</a>
                    </p>
                    </div>
            </div>

            <!-- image to the right -->
            <img class="image-area" 
                src="images/login.jpeg" 
                alt="">

        </div>
    </main>
    <script src="JS/theme.js"></script>

</body>
</html>
